<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="shoplist.css">
    <title>Shopping List</title>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Shopping List</h1>
    </header>

    <div class="block">
        <div class="cart-redactor">

            <div class="input-sec">
                <input type="text" class="cart-redactor-input" placeholder="Enter item name">
                <button class="add-to-list-button" data-tooltip="Add an element to the list">Add to list</button>
            </div>

            <div class="row is-bought">
                <span class="item" style="text-decoration: line-through; color: #888;">Tomatoes</span>
                
                <div class="counter-group">
                    <span class="counter">2</span>
                </div>
                
                <div class="action-group">
                    <button class="bought-button" data-tooltip="Mark as not bought">Not bought</button>
                </div>
            </div>

            <div class="row">
                <span class="item">Bread</span>
                
                <div class="counter-group">
                    <button class="minus-button" data-tooltip="Decrease element quantity">-</button>
                    <span class="counter">2</span>
                    <button class="plus-button" data-tooltip="Increase element quantity">+</button>
                </div>
                
                <div class="action-group">
                    <button class="bought-button" data-tooltip="Mark as bought">Bought</button>
                    <button class="delete-button" data-tooltip="Delete from cart">✖</button>
                </div>
            </div>

            <div class="row">
                <span class="item">Cheese</span>
                
                <div class="counter-group">
                    <button class="minus-button" data-tooltip="Decrease element quantity" style="background-color: #f19f9f;">-</button>
                    <span class="counter">1</span>
                    <button class="plus-button" data-tooltip="Increase element quantity">+</button>
                </div>
                
                <div class="action-group">
                    <button class="bought-button" data-tooltip="Mark as bought">Bought</button>
                    <button class="delete-button" data-tooltip="Delete from cart">✖</button>
                </div>
            </div>
        </div>

        <div class="cart-data">
            <h2 class="data">Left</h2>
            <div class="item-row">
                <div class="item-in-list"> Bread
                    <span class="counter-in-list">2</span>
                </div>
                <div class="item-in-list"> Cheese
                    <span class="counter-in-list">1</span>
                </div>
            </div>
            
            <h2 class="data">Bought</h2>
            <div class="item-row">
                <div class="item-in-list" style="text-decoration: line-through; color: #888;"> Tomatoes
                    <span class="counter-in-list">2</span>
                </div>
            </div>
        </div>
    </div>

    <span class="badge">
        <span class="title">Buy List</span>
        <span class="created-by">created by:</span>
        <span class="author">Nikita Hella</span>
    </span>
</body>
</html>
