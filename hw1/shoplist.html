<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta lang="uk">
    <link rel="stylesheet" href="shoplist.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Список покупок</h1>
    </header>
    <hr>

    <div class="block">
        <div class="cart-redactor">

                <input type="text" class="cart-redactor-input" placeholder="Enter item name">
                <button class="add-to-list-button">Add to list</button>
                <hr>

            <div class="row">
                <span class="item">Tomatoes</span>
                <button class="minus-button">-</button>
                <span class="counter">1</span>
                <button class="plus-button">+</button>
                <button class="bought-button">Bought</button>
                <button class="delete-button">Delete</button>
                <hr>
            </div>

            
            <div class="row">
                <span class="item">Bread</span>
                <button class="minus-button">-</button>
                <span class="counter">1</span>
                <button class="plus-button">+</button>
                <button class="bought-button">Bought</button>
                <button class="delete-button">Delete</button>
                <hr>
            </div>
            

            <div class="row">
                <span class="item">Milk</span>
                <button class="minus-button">-</button>
                <span class="counter">1</span>
                <button class="plus-button">+</button>
                <button class="bought-button">Bought</button>
                <button class="delete-button">Delete</button>
                <hr>
            </div>
            

        </div>

        <div class="cart-data">
            <span class="data">Left
                <span class="item-in-list">
                <span> Tomatoes 
                    <span class="counter-in-list">1</span>
                </span>
                <span> Bread
                    <span class="counter-in-list">1</span>
                </span>
                <span> Milk
                    <span class="counter-in-list">1</span>
                </span>
            </span>
            <hr>
            </span>
            

            <span class="data">Bought</span>
        </div>
    </div>

    <span class="badge">
        Buy List
        <span class="created-by">created by:</span>
        <span class="author">Nikita Hella</span>
    </span>
</body>
</html>
